[project]
name = "retrolibx"
version = "0.1.0"
description = "Universal Retro Game Library Converter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RetroLibX contributors" }]
dependencies = [
  "lxml>=5.3",
  "platformdirs>=4.3",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
  "typer>=0.15",
]

[project.scripts]
retrolibx = "retrolibx.cli:run"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrolibx"]

[tool.hatch.build]
include = ["src/retrolibx/registry/systems.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["retrolibx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["retrolibx"]

[[tool.mypy.overrides]]
module = ["yaml", "lxml", "lxml.*"]
ignore_missing_imports = true
